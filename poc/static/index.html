<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siteora POC — siting rules</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --mute:#5c6577; --line:#dfe3ea; --accent:#2457d6;
          --ok:#1d7a46; --warn:#a15c00; --review:#8a3ffc; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 24px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; } header p { margin:4px 0 0; color:var(--mute); }
  main { max-width:1200px; margin:0 auto; padding:16px 24px 48px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  form { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:10px 12px; align-items:end; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--mute); }
  input, select { font:inherit; padding:7px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  .wide { grid-column:span 3; } .full { grid-column:1 / -1; }
  #dynamicInputs { display:contents; }
  #dynamicInputs .hdr { font-size:13px; font-weight:600; color:var(--ink); margin-top:4px; }
  .checks { display:flex; gap:16px; flex-wrap:wrap; grid-column:span 4; }
  .checks label { flex-direction:row; align-items:center; gap:6px; color:var(--ink); font-size:13px; }
  button { font:inherit; padding:8px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:progress; }
  .kv { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px 16px; }
  .kv div span { display:block; font-size:12px; color:var(--mute); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--mute); font-weight:600; }
  .req { font-weight:600; white-space:nowrap; }
  .tag { display:inline-block; padding:1px 6px; border-radius:10px; font-size:11px; font-weight:600; }
  .DETERMINED { background:#e5f4ec; color:var(--ok); } .MANUAL_REVIEW { background:#f1e9ff; color:var(--review); }
  /* Weight: which row governs when several rules target the same boundary. primary = the number that applies today;
     conditional = a relaxation that only replaces the primary if ITS OWN conditions (shown in its row) are met;
     supplement = not competing with its paired rule at all, the two together are the answer; subsumed = a looser
     minimum that a stricter primary row already satisfies, so it is true but not the deciding number. */
  tr.w-conditional { border-left:3px solid var(--warn); } tr.w-supplement { border-left:3px solid var(--accent); }
  tr.w-primary { border-left:3px solid var(--ok); } tr.w-subsumed { border-left:3px solid var(--line); opacity:.65; }
  tr.w-displaced { border-left:3px solid #b42318; opacity:.7; }
  /* pending = the sole candidate for this boundary, but its own value is not known yet (MANUAL REVIEW) -- never
     green (nothing applies "today" here), dashed purple to match the MANUAL REVIEW badge colour. */
  tr.w-pending { border-left:3px dashed var(--review); }
  .relnote { font-size:12px; margin-top:4px; white-space:normal; }
  .relnote.conditional { color:var(--warn); } .relnote.supplement { color:var(--accent); }
  .BUILDING { background:#e8eefc; color:var(--accent); } .PLANNING { background:#fdf1e1; color:var(--warn); }
  .POOL_SAFETY { background:#fde8e8; color:#b42318; } .INFRASTRUCTURE { background:#eef0f3; color:var(--mute); }
  details summary { cursor:pointer; color:var(--accent); font-size:12px; }
  .quote { white-space:pre-wrap; background:#f8f9fb; border-left:3px solid var(--line); padding:6px 8px; margin:6px 0; font-size:12px; }
  .warn { color:var(--warn); } .mute { color:var(--mute); } .err { color:#b42318; font-weight:600; }
  ul { margin:6px 0; padding-left:18px; }
  #map { height:460px; border-radius:6px; border:1px solid var(--line); }
  .map-home { font-size:18px; line-height:30px !important; text-align:center; text-decoration:none; color:var(--ink); }
  .compass { background:var(--card); border:1px solid var(--line); border-radius:50%; box-shadow:0 1px 4px rgba(16,24,40,.18);
             width:36px; height:36px; display:flex; align-items:center; justify-content:center; }
  .src td a { margin-right:10px; white-space:nowrap; }
  .hit { font-weight:600; }
  /* Leaflet's own controls are plain white boxes with no border -- restyle them to match this app's card
     look (border + soft shadow) instead of leaving the stock Leaflet chrome untouched. */
  .leaflet-bar { box-shadow:0 1px 4px rgba(16,24,40,.18); }
  .leaflet-control-zoom a, .map-home { background:var(--card); color:var(--ink); }
  .leaflet-control-zoom a:hover, .map-home:hover { background:var(--bg); }
  .leaflet-control-layers, .leaflet-popup-content-wrapper { box-shadow:0 1px 4px rgba(16,24,40,.18); border:1px solid var(--line); border-radius:8px; }
  .leaflet-control-layers-expanded { padding:10px 12px; font-size:13px; }
  .leaflet-control-layers label { margin:3px 0; }
  .leaflet-control-layers-base::before, .layer-group-label {
    display:block; font-size:10px; font-weight:700; color:var(--mute); text-transform:uppercase;
    letter-spacing:.04em; margin:2px 0 4px; padding-top:6px; border-top:1px solid var(--line);
  }
  .leaflet-control-layers-base::before { content:"Basemap"; border-top:none; padding-top:0; }
  .layer-group-label:first-child { border-top:none; padding-top:0; }
  .leaflet-popup-content { margin:10px 12px; }
  .leaflet-control-attribution { background:rgba(255,255,255,.85); border-radius:4px 0 0 0; font-size:10px; }
  .property-marker { background:transparent; border:none; filter:drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .popup-title { font-weight:600; font-size:13px; margin-bottom:4px; padding-bottom:4px; border-bottom:1px solid var(--line); }
  .popup-row { display:flex; gap:10px; font-size:12px; padding:2px 0; }
  .popup-row .popup-k { color:var(--mute); flex:0 0 auto; }
  .popup-row .popup-v { font-weight:500; word-break:break-word; }
  .popup details { margin-top:4px; } .popup details summary { font-size:11px; }
  @media (max-width: 800px) { form { grid-template-columns:1fr 1fr; } .wide, .checks { grid-column:1 / -1; } .kv { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Siteora POC — what siting rules apply?</h1>
  <p>Enter a Queensland address (Brisbane, Gold Coast, Moreton Bay, Sunshine Coast, Logan, Ipswich, Redland) and the proposed structure.</p>
</header>
<main>
  <div class="card">
    <form id="f">
      <label class="wide">Address<input name="address" required value="15 Jubilee Terrace, Bardon QLD 4065"></label>
      <label>Structure<select name="structure">
        <option value="SHED">Shed</option><option value="GARAGE">Garage</option><option value="CARPORT">Carport</option>
        <option value="PATIO">Patio (roofed)</option><option value="PERGOLA">Pergola</option><option value="DECK">Deck</option>
        <option value="DETACHED_LAUNDRY">Detached laundry</option><option value="GATEHOUSE">Gatehouse</option>
        <option value="POOL_INGROUND">In-ground pool</option><option value="POOL_ABOVEGROUND">Above-ground pool</option>
        <option value="POOL_FENCE">Pool fence</option></select></label>
      <label>Height (m)<input name="height_m" type="number" step="0.1" value="3.0"></label>
      <label>Length (m)<input name="length_m" type="number" step="0.1" value="6"></label>
      <label>Width (m)<input name="width_m" type="number" step="0.1" value="4"></label>
      <label>Mean height (m)<input name="mean_height_m" type="number" step="0.1" placeholder="= height"></label>
      <label>Lot slope (%)<input name="lot_slope_pct" type="number" step="0.5" placeholder="unknown"></label>
      <label>Existing outbuildings (m²)<input name="existing_outbuildings_m2" type="number" step="1" placeholder="0"></label>
      <label>Assessment date<input name="date" type="date"></label>
      <label>Zone (override)<select name="zone_id" id="zone"><option value="">from council map</option></select></label>
      <label title="Only needed when the council map's zone has more than one precinct and the automatic match is ambiguous or wrong (e.g. Moreton Bay's Emerging Community 'Transition' precinct). Filtered to the zone selected above, if any.">
        Precinct (override)<select name="precinct" id="precinct"><option value="">from council map</option></select></label>
      <div class="checks">
        <label title="Needed before the lookup even runs: a corner lot gets an extra SECONDARY_FRONTAGE_ROAD boundary pass, which has to be decided before the council/zone/rules for that boundary can be resolved. The only one of this row's fields that is genuinely relevant to every property everywhere -- the rest only matter for specific structures or councils, so they are asked below, after the lookup, only when a rule actually needs them.">
        <input type="checkbox" name="is_corner_lot"> Corner lot</label>
      </div>
      <div class="full" id="dynamicInputs"></div>
      <div class="checks full" id="scopeChecks">
        <label title="Show only setback rules (front / side / rear / side-and-rear) — no height, site cover, pool or garage-width rules. The location is still looked up, since rules need the zone.">
          <input type="checkbox" id="scopeSetbacks"> Setbacks only</label>
        <label title="Show only the location and map data (zone, overlays, constraints, parcel, sources) — no rule evaluation at all, so this is faster.">
          <input type="checkbox" id="scopeMaps"> Maps only</label>
        <span class="mute" id="scopeNote" style="font-size:12px"></span>
      </div>
      <div><button id="go">Find rules</button></div>
    </form>
  </div>
  <div id="out"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const req = r => ['IS_TRUE','IS_FALSE'].includes(r.operator) ? (r.operator === 'IS_TRUE' ? 'must hold' : 'must not occur')
               : (r.required === 0 && r.operator === '>=') ? 'built to boundary permitted'
               : `${r.operator} ${r.required ?? '?'} ${r.unit ?? ''}`;
const ORDER = {'':0, 'PRIMARY_FRONTAGE':1, 'SECONDARY_FRONTAGE_ROAD':2, 'SIDE':3, 'REAR':4};
// QDC MP 1.1 Table A1 street hierarchy (access place/street vs collector) -- auto-derived for most councils from
// Council's own road-hierarchy map (see server-ts/src/core/geo.ts STREET_HIERARCHY_SOURCES), or set with
// --street-type / street_type= for councils with no such source, or to override a derived guess known to be wrong.
function streetTypeHtml(facts) {
  const st = (facts || {}).street_type;
  if (!st) return '<span class="warn">Not resolved — manual review</span> <span class="mute">(set street_type=access|collector to resolve)</span>';
  const label = st.value === 'COLLECTOR' ? 'Collector' : st.value === 'ACCESS_STREET' ? 'Access place/street' : esc(st.value);
  return `${esc(label)} <span class="mute" title="${esc(st.source || '')}">ⓘ</span>`;
}
// Battle-axe/rear lot: pre-filled from a parcel-shape heuristic (handle+body profile, see
// geo.battleAxeSignal) when the shape gives a clear read either way. It is a shape SIGNAL, not a ground
// truth -- shown here (not silently applied) so a wrong guess is visible; override with
// is_battle_axe_lot=yes|no (API/CLI) if the actual driveway/access disagrees with it.
// Raw DCDB lot_area is 0 for a Building/Group Titles Plan's common property (lot "00000") -- the whole site
// shared by every unit, not any one unit's own ground lot -- so showing it directly read as "lot size: 0", when
// the real answer is "no individual lot area here at all". Show the resolved fact (left unset server-side for
// common property, see engine.ts buildFacts) instead of the raw attribute, and say why when it's missing.
function lotAreaHtml(p, facts) {
  if (p.lot === '00000') return '<span class="warn">Common property — no individual lot area</span>';
  const f = (facts || {}).lot_area_m2;
  if (!f) return '<span class="mute">—</span>';
  return `${esc(f.value)} m² <span class="mute" title="${esc(f.source || '')}">ⓘ</span>`;
}
function battleAxeHtml(facts) {
  const f = (facts || {}).is_battle_axe_lot;
  if (!f) return '<span class="warn">Not resolved — manual review</span> <span class="mute">(answer the "Battle-axe / rear lot" field below, or set is_battle_axe_lot=yes|no to resolve)</span>';
  const estimated = /^ESTIMATED/.test(f.source || '');
  return `${f.value ? 'Yes' : 'No'}${estimated ? ' <span class="mute">(estimated — check the driveway)</span>' : ''} <span class="mute" title="${esc(f.source || '')}">ⓘ</span>`;
}
let lastLg = null;

// "Setbacks only" / "Maps only": checking one unchecks the other, so the scope sent to the server is never
// ambiguous. Leaving both unchecked shows everything, as before.
const scopeSetbacks = $('#scopeSetbacks'), scopeMaps = $('#scopeMaps'), scopeNote = $('#scopeNote');
function updateScopeNote() {
  scopeNote.textContent = scopeSetbacks.checked ? '— only setback rules will be shown; maps and site data are skipped'
    : scopeMaps.checked ? '— only the location and map data will be shown; no rules are evaluated' : '';
}
scopeSetbacks.addEventListener('change', () => { if (scopeSetbacks.checked) scopeMaps.checked = false; updateScopeNote(); });
scopeMaps.addEventListener('change', () => { if (scopeMaps.checked) scopeSetbacks.checked = false; updateScopeNote(); });

// Calls to our own server, with errors in plain words: server not running, too slow, not JSON, or the server's own
// message (400 bad input, 503 database / map service unavailable, 500 code fault with a log reference).
async function api(path, timeoutS = 240) {
  let r;
  try {
    r = await fetch(path, {signal: AbortSignal.timeout(timeoutS * 1000)});
  } catch (e) {
    if (e.name === 'TimeoutError') throw Object.assign(new Error(`No answer after ${timeoutS} s — a map service may be very slow. Try again.`), {kind: 'warn'});
    throw Object.assign(new Error(`Cannot reach the Siteora server at ${location.origin}. Is it running? Start it with "npm start" and try again.`), {kind: 'warn'});
  }
  let d;
  try { d = await r.json(); }
  catch { throw new Error(`The server gave an unexpected answer (HTTP ${r.status}). It may be an older version: restart it with "npm start".`); }
  if (!r.ok) throw Object.assign(new Error(d.error || `HTTP ${r.status}`), {kind: r.status === 503 ? 'warn' : 'err'});
  return d;
}

function showError(e) {
  $('#out').innerHTML = `<div class="card ${e.kind === 'warn' ? 'warn' : 'err'}">${esc(e.message)}
    <div style="margin-top:8px"><button type="button" onclick="document.querySelector('#f').requestSubmit()">Try again</button></div></div>`;
}

let allPrecincts = [];
async function loadZones(lg) {
  if (lg === lastLg) return;
  let z;
  try { z = await api(`/api/zones?lg_id=${encodeURIComponent(lg)}`, 30); }
  catch { return; }   // the zone/precinct lists are optional: the form still works without them
  lastLg = lg;
  allPrecincts = z.precincts;
  const sel = $('#zone'), cur = sel.value;
  sel.innerHTML = '<option value="">from council map</option>' + z.zones.map(x => `<option value="${esc(x.zone_id)}">${esc(x.name)}</option>`).join('');
  sel.value = cur;
  fillPrecinctOptions();
}

// The precinct list is filtered to whichever zone is selected above (a precinct belongs to exactly one
// zone), so re-run this whenever the zone selection changes, not just after a fresh /api/zones load.
function fillPrecinctOptions() {
  const zoneId = $('#zone').value, sel = $('#precinct'), cur = sel.value;
  const list = zoneId ? allPrecincts.filter(p => p.zone_id === zoneId) : allPrecincts;
  sel.innerHTML = '<option value="">from council map</option>' + list.map(x => `<option value="${esc(x.precinct_id)}">${esc(x.name)}</option>`).join('');
  sel.value = cur;
}
$('#zone').addEventListener('change', fillPrecinctOptions);

// Shown only after a lookup, and only for the facts this property's own manual-review results actually need
// (d.missing_inputs, computed server-side from the real candidate rules for this council/zone/precinct) --
// so the form asks for exactly what's relevant here, not every optional field that exists across every council.
const FIELD_GROUPS = [
  { facts: ['street_type'], html: () =>
    `<label title="QDC MP 1.1 Table A1: the frontage street's functional classification. Auto-derived for most councils; set this yourself if it came back unresolved, or to override a derived guess you know is wrong.">
      Street type<select name="street_type"><option value="">unknown</option><option value="access">Access place/street</option><option value="collector">Collector</option></select></label>` },
  { facts: ['distance_to_adjoining_habitable_window_m'], html: () =>
    `<label class="full" title="Distance from this structure to the nearest required habitable-room window of an adjoining dwelling.">Neighbour window (m)
      <input name="window_distance_m" type="number" step="0.1" placeholder="unknown">
      <span class="mute" style="font-size:11px;font-weight:400">Left blank, the privacy/screening rule shown below stays <b>MANUAL REVIEW</b> — it is never assumed to be far enough away. Enter the distance and press "Find rules" again to turn it <b>DETERMINED</b> (green).</span></label>` },
  { facts: ['btb_length_on_boundary_m'], html: () =>
    `<label title="QDC A2(d): the 9 m built-to-boundary limit counts every building or part along this boundary, including the existing house -- not just this structure.">Other building (e.g. house) also within 1.5 m of this boundary?<select name="other_building_on_boundary">
      <option value="">unknown</option><option value="yes">yes</option><option value="no">no</option></select>
      <span class="mute" style="font-size:11px;font-weight:400">Answer "no" and this structure's own footprint is used as the total. Answer "yes" (or leave this blank) and the row below stays <b>MANUAL REVIEW</b> until you give the actual combined length -- guessing "no" when something else is there could understate the true total and wrongly clear a boundary that's really over the limit.</span></label>
      <label class="full" title="Combined length of every building/part within the clearance along this boundary, including the existing house.">Combined length on this boundary (m)
      <input name="btb_length_m" type="number" step="0.1" placeholder="unknown"></label>` },
  { facts: ['lot_from_residential_subdivision'], html: () =>
    `<label title="Gold Coast Emerging community zone: the setbacks and site cover depend on it">Lot from a residential subdivision<select name="lot_from_residential_subdivision">
      <option value="">unknown</option><option value="yes">yes</option><option value="no">no</option></select></label>` },
  { facts: ['is_battle_axe_lot'], html: () =>
    `<label title="Battle-axe/rear lot: behind another lot, reached by a narrow access handle rather than directly fronting the street.">Battle-axe / rear lot<select name="is_battle_axe_lot">
      <option value="">unknown</option><option value="yes">yes</option><option value="no">no</option></select>
      <span class="mute" style="font-size:11px;font-weight:400">Shown because the parcel shape didn't give a clear read either way (see "Battle-axe / rear lot" above). Some councils require a <i>larger</i> setback on a rear lot than the general figure, so this is never assumed "no" — left blank, the rear-lot rule below stays <b>MANUAL REVIEW</b>.</span></label>` },
  { facts: ['carport_is_unenclosed'], html: () =>
    `<label title="Logan's 6m x 6m built-to-boundary carport concession (Table 9.3.2.3.1 AO4(a)).">Carport is unenclosed (Logan)<select name="carport_is_unenclosed">
      <option value="">unknown</option><option value="yes">yes</option><option value="no">no</option></select>
      <span class="mute" style="font-size:11px;font-weight:400">Open on the front and both sides — no garage doors or walls there. The rear may attach to the house; that still counts as "unenclosed" here, so this is a different, narrower question than "Roofed/Enclosed" below. Left blank, the built-to-boundary row below stays <b>MANUAL REVIEW</b> instead of assuming either way — getting it wrong would swap a full road setback for a built-to-boundary allowance or vice versa.</span></label>` },
  { facts: ['is_roofed', 'is_enclosed'], html: () =>
    `<label title="QDC MP 1.1/1.2 A2(c) (and the Queensland Housing Code's 'covered outdoor room' rows): whether this structure is roofed, and whether it's enclosed by walls.">Roofed<select name="is_roofed">
      <option value="">unknown</option><option value="yes">yes</option><option value="no">no</option></select></label>
      <label>Enclosed<select name="is_enclosed"><option value="">unknown</option><option value="yes">yes</option><option value="no">no</option></select>
      <span class="mute" style="font-size:11px;font-weight:400">Same meaning in every council (it is a State code test, not a council-specific one) — but only relevant for an outdoor/pergola-type structure, which is why it is asked here rather than always: a true ornamental pergola is normally open/unroofed, which is the state of affairs the exemption below actually tests for. Left blank, that row stays <b>MANUAL REVIEW</b> rather than assuming either way.</span></label>` },
  { facts: ['is_attached_to_dwelling'], html: () =>
    `<label title="Gold Coast, Moreton Bay and Logan only: freestanding (detached) garages/carports/outbuildings have a different height limit than ones attached to the dwelling.">Attached to the house<select name="is_attached_to_dwelling">
      <option value="">unknown</option><option value="yes">yes</option><option value="no">no</option></select>
      <span class="mute" style="font-size:11px;font-weight:400">Shown because this council's height limit for this structure depends on it. Not asked for councils whose rules don't use this distinction.</span></label>` },
  { facts: ['adjoins_canal_or_lake'], html: () =>
    `<label title="Redland and Sunshine Coast only: a canal/lake-frontage lot has its own, larger boundary clearance for buildings and structures (including outbuildings and pools).">Lot adjoins a canal or lake<select name="adjoins_canal_or_lake">
      <option value="">unknown</option><option value="yes">yes</option><option value="no">no</option></select>
      <span class="mute" style="font-size:11px;font-weight:400">Never assumed "no": that clearance (4.5-9 m depending on council) is <i>larger</i> than the general setback, so guessing "not waterfront" could understate the real requirement for a lot that actually is. Left blank, the canal/lake-specific row stays <b>MANUAL REVIEW</b>.</span></label>` },
  { facts: ['pre1946_neighbour_avg_front_setback_m'], html: () =>
    `<label class="full" title="Brisbane Traditional building character overlay only: average front setback of the nearest pre-1946 houses on the same street.">Avg. pre-1946 neighbour setback (m)
      <input name="pre1946_setback_m" type="number" step="0.1" placeholder="unknown">
      <span class="mute" style="font-size:11px;font-weight:400">This lot is in Brisbane's Traditional building character overlay, so this rule applies — but the actual figure needs a site/aerial-photo check of which neighbouring houses are pre-1946 and how far back they sit; it is never guessed. Left blank it stays <b>MANUAL REVIEW</b>; enter it and resubmit to turn it <b>DETERMINED</b> (green).</span></label>` },
  { facts: ['solid_wall_between_pool_and_boundary_height_m', 'solid_wall_top_above_coping_m'], html: () =>
    `<label title="QDC A2(e): a pool may come within the standard clearance (down to 0 m) behind a solid wall/fence that is tall enough, built between the pool and this boundary.">Pool boundary wall height (m)
      <input name="pool_wall_height_m" type="number" step="0.1" placeholder="unknown"></label>
      <label title="How far the top of that wall/fence sits above the pool coping.">Wall top above coping (m)
      <input name="pool_wall_top_above_coping_m" type="number" step="0.1" placeholder="unknown">
      <span class="mute" style="font-size:11px;font-weight:400">Needs >= 1.8 m wall height and >= 1.0 m above coping to qualify. Left blank, the row below stays <b>MANUAL REVIEW</b> rather than assuming no wall — the standard clearance above still applies either way.</span></label>` },

    Council data is used first; Queensland Government data fills categories the council does not publish.
    Maps can be incomplete or approximate — confirm services with a Before You Dig Australia (BYDA) enquiry.
    Colours match the map; layers with a hit are drawn on the map. Power lines: ${swatch(catColor('Electricity'))} overhead,
    ${swatch(catColor('Electricity'), true)} underground.</p>
    <table><tr><th>Category</th><th>Layer</th><th>On or near this lot?</th><th>What</th></tr>` +
    cats.map(cat => C.filter(c => c.category === cat).map((c, i) => `<tr>
      <td>${i ? '' : `${swatch(catColor(cat))} <b>${esc(cat)}</b>`}</td>
      <td>${esc(c.name)} <span class="mute">(${esc(c.scope)}${c.distance_m ? `, within ${c.distance_m} m` : ''})</span> ${link(c)}</td>
      <td class="${c.hit ? 'hit warn' : 'mute'}">${c.status !== 'ok' ? `<span class="err" title="${esc(c.error || '')}">service did not answer</span><br><span class="mute" style="font-size:11px">${esc((c.error || '').slice(0, 90))}</span>` : c.hit ? `Yes (${c.count})${c.distance_m > 1 ? `<br><span class="mute">on or within ${c.distance_m} m</span>` : ''}` : 'No'}</td>
      <td>${c.geometry === 'polygon' && (c.values || []).length
        // areas: each value with its map shade, so the table is the legend for banded overlays
        ? (c.values || []).slice().sort().map(v => `<div><span data-layer="${esc(c.layer)}" data-value="${esc(v)}" style="display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;background:${areaColor(c, null, v)}"></span> ${esc(fmtCode(c, v))}</div>`).join('')
        : esc((c.values || []).map(v => fmtCode(c, v)).join('; '))}${(c.details || []).length && c.hit ? `<details><summary>details</summary><div class="quote">${esc(c.details.map(x => Object.entries(x).map(([k, v]) => `${k}: ${fmtVal(k, v)}`).join(', ')).join('\n'))}</div></details>` : ''}</td>
    </tr>`).join('')).join('') + '</table></div>';
}

function sourcesCard(d) {
  const S = d.location.sources || [];
  return `<div class="card"><h3 style="margin-top:0">Sources used for this property</h3>
    <p class="mute">"API result" opens the exact query for this property in the source service; "Layer" shows the layer's
    fields and description; "Map viewer" opens the layer on the ArcGIS map viewer at this property.
    ${d.scheme_viewer ? `Council planning scheme: <a href="${esc(d.scheme_viewer)}" target="_blank" rel="noopener">${esc(d.scheme_viewer)}</a>` : ''}</p>
    <table class="src"><tr><th>Looked up</th><th>Source</th><th>Result here</th><th>Links</th></tr>` +
    S.map(s => `<tr><td>${esc(s.what)}</td><td>${esc(s.source)}<div class="mute" style="font-size:11px;word-break:break-all">${esc(s.layer)}</div></td>
      <td class="${s.hit ? 'hit' : ''}">${esc(s.result)}</td>
      <td><a href="${esc(s.query_url)}" target="_blank" rel="noopener">API result</a>
          <a href="${esc(s.layer_url)}" target="_blank" rel="noopener">Layer</a>
          <a href="${esc(s.viewer_url)}" target="_blank" rel="noopener">Map viewer</a></td></tr>`).join('') + '</table></div>';
}

// An area layer drawn from /api/features: reloads the visible part after each pan / zoom (from zoom 15), drawn on a
// canvas (fast for thousands of grid steps), in the publisher's colours (loaded first, so nothing is restyled later).
// ONE canvas for every layer on the map. Canvases stack on top of each other and only the topmost receives clicks
// (a click on a lower canvas never reaches it), so one canvas per layer or per pane left only the top layer clickable.
// A single canvas tests the click against all its shapes. The tolerance makes thin lines and small points clickable.
// Drawing order inside it is set by bringToFront (see stackLayers): areas at the bottom, flood above, power lines on top.
function paneRenderer(map) {
  return map._renderer1 || (map._renderer1 = L.canvas({pane: 'constraints', padding: 0.3, tolerance: 8}));
}
const LAYER_PRIORITY = {Zone: 0, Flood: 2, Easements: 3, Heritage: 3, Buildings: 3.5, Electricity: 6};
function stackLayers(map) {
  clearTimeout(map._stackTimer);
  map._stackTimer = setTimeout(() => {
    const front = l => (l.eachLayer ? l.eachLayer(front) : l.bringToFront && l.bringToFront());
    [...(map._clipped || [])].sort((a, b) => a._prio - b._prio).forEach(g => g.eachLayer(front));
  }, 0);
}
const ClippedLayer = window.L ? L.FeatureGroup.extend({
  initialize(c, style, popupHtml, pointToLayer) {
    L.FeatureGroup.prototype.initialize.call(this);
    this._c = c; this._style = style; this._popup = popupHtml; this._ptl = pointToLayer; this._seq = 0;
    this._pane = 'constraints';
    // stacking, bottom to top: zone areas, other areas, flood, easements / buildings (small areas must be clickable above
    // the big overlays), lines, points, power lines. A click opens the topmost shape under it.
    this._prio = LAYER_PRIORITY[c.category] ?? (c.geometry === 'point' ? 5 : c.geometry === 'line' ? 4 : 1);
  },
  onAdd(map) {
    this._renderer = paneRenderer(map);
    (map._clipped = map._clipped || new Set()).add(this);
    L.FeatureGroup.prototype.onAdd.call(this, map);
    // point assets with a distance_m (hydrants, valves, poles…) are tied to the property, not the view: fetch once,
    // in a small box around the property, instead of redrawing every nearby asset across whatever is panned into view
    this._fixedBox = this._c.geometry === 'point' && this._c.distance_m != null;
    if (!this._fixedBox) map.on('moveend', this._schedule, this);
    this._load();
  },
  onRemove(map) {
    if (!this._fixedBox) map.off('moveend', this._schedule, this);
    if (map._clipped) map._clipped.delete(this);
    clearTimeout(this._timer);
    L.FeatureGroup.prototype.onRemove.call(this, map);
  },
  _schedule() { clearTimeout(this._timer); this._timer = setTimeout(() => this._load(), 250); },
  // If our server cannot clip (an older server without /api/features, or an error), draw the layer straight from
  // the publisher's service instead, so an area layer is never silently missing.
  _fallBack(why) {
    if (this._fb || !this._map) return;
    console.warn(`${this._c.name}: drawing from the source service (${why})`);
    this.clearLayers();
    this._fb = L.esri.featureLayer({url: this._c.layer, where: this._c.where || '1=1', simplifyFactor: 0.5, precision: 6,
      minZoom: 15, pane: this._pane, style: this._style});
    this._fb.bindPopup(l => this._popup(l.feature));
    this.addLayer(this._fb);
  },
  _load() {
    const map = this._map;
    if (!map || this._fb) return;
    if (!this._fixedBox && map.getZoom() < 15) { this.clearLayers(); return; }
    const seq = ++this._seq;
    const bbox = this._fixedBox ? propertyBox(map._propertyCenter, this._c.distance_m) : (() => {
      const b = map.getBounds().pad(0.15);
      return [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(n => n.toFixed(6)).join(',');
    })();
    Promise.all([applyPublisherColors(this._c),
      fetch(`/api/features?layer=${encodeURIComponent(this._c.layer)}&bbox=${bbox}`)
        .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))])
      .then(([, fc]) => {
        if (seq !== this._seq || !this._map) return;
        if (!fc || fc.error || !Array.isArray(fc.features)) return this._fallBack(fc && fc.error || 'bad response');
        this.clearLayers();
        L.geoJSON(fc, {style: this._style, renderer: this._renderer, pointToLayer: this._ptl,
          onEachFeature: (f, l) => l.bindPopup(() => this._popup(f))}).eachLayer(l => this.addLayer(l));
        stackLayers(map);
      }).catch(e => { if (seq === this._seq) this._fallBack(e.message); });
  },
}) : null;

let MAP = null;
const MAP_LIMIT_KM = 10;   // how far from the property the map can be moved
// a small box around the property, distance_m plus a visual margin so a pin right at the edge isn't clipped
function propertyBox(center, distanceM) {
  const pad = Math.max(distanceM, 10) + 10;
  const dLat = pad / 111320, dLon = pad / (111320 * Math.cos(center[0] * Math.PI / 180));
  return [center[1] - dLon, center[0] - dLat, center[1] + dLon, center[0] + dLat].map(n => n.toFixed(6)).join(',');
}
const COLORS = ['#2457d6', '#1d7a46', '#a15c00', '#8a3ffc', '#b42318', '#0e7490', '#be185d', '#4d7c0f', '#7c2d12', '#334155'];
// A small pin in the app's accent colour, replacing Leaflet's stock blue teardrop marker.
const propertyIcon = window.L ? L.divIcon({className: 'property-marker',
  html: '<svg width="26" height="34" viewBox="0 0 26 34" xmlns="http://www.w3.org/2000/svg"><path d="M13 0C5.8 0 0 5.8 0 13c0 9.7 13 21 13 21s13-11.3 13-21C26 5.8 20.2 0 13 0z" fill="#2457d6"/><circle cx="13" cy="13" r="5" fill="#fff"/></svg>',
  iconSize: [26, 34], iconAnchor: [13, 34], popupAnchor: [0, -30]}) : null;
// Splits the overlay checklist into labelled sections (Leaflet's layer control has no native grouping) --
// `groups` in the same order the overlay entries were added to the `overlays` object.
function groupOverlayControl(control, groups) {
  const list = control.getContainer().querySelector('.leaflet-control-layers-overlays');
  if (!list) return;
  const items = [...list.children];
  let offset = 0;
  groups.forEach(g => {
    if (g.count > 0 && items[offset]) {
      const h = document.createElement('div');
      h.className = 'layer-group-label'; h.textContent = g.label;
      list.insertBefore(h, items[offset]);
    }
    offset += g.count;
  });
}
function drawMap(d) {
  if (!window.L || !L.esri) { $('#map').innerHTML = '<p class="err" style="padding:12px">Map libraries could not load (offline?).</p>'; return; }
  if (MAP) { MAP.remove(); MAP = null; }
  const L0 = d.location, center = [L0.lat, L0.lon];
  // the map stays within MAP_LIMIT_KM of the property: panning stops at the edge (viscosity 1 = a hard edge) and the
  // view cannot be zoomed out further than that area
  const dLat = MAP_LIMIT_KM / 111.32, dLon = MAP_LIMIT_KM / (111.32 * Math.cos(L0.lat * Math.PI / 180));
  const limit = L.latLngBounds([L0.lat - dLat, L0.lon - dLon], [L0.lat + dLat, L0.lon + dLon]);
  MAP = L.map('map', {maxBounds: limit, maxBoundsViscosity: 1.0}).setView(center, 18);
  MAP.setMinZoom(MAP.getBoundsZoom(limit, true));
  MAP._propertyCenter = center;
  // CartoDB Positron: a muted light basemap (free, no key) for a calmer default view than raw OSM tiles --
  // same OpenStreetMap data underneath, just redrawn.
  const streets = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {maxZoom: 20,
    maxNativeZoom: 19, subdomains: 'abcd', detectRetina: true,
    attribution: '&copy; OpenStreetMap contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'});
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom: 20, maxNativeZoom: 19, attribution: 'Imagery &copy; Esri'});
  // Queensland Government statewide imagery (SISP, 10 cm in Brisbane): the same source as the Brisbane City Plan map,
  // and much newer than Esri World Imagery. Cached to level 20 (1:564), in Web Mercator.
  const qldSat = L.tileLayer('https://spatial-img.information.qld.gov.au/arcgis/rest/services/Basemaps/LatestStateProgram_AllUsers/ImageServer/tile/{z}/{y}/{x}',
    {maxZoom: 21, maxNativeZoom: 20, attribution: 'Imagery &copy; State of Queensland (Department of Resources) and Brisbane City Council'}).addTo(MAP);   // the default basemap
  const overlays = {};
  // Shows the first few non-empty fields directly; the rest (raw GeoJSON attributes, which vary by layer) sit
  // behind "All fields" so the popup reads as a feature summary, not a database dump, without hiding anything.
  const popup = f => {
    const entries = Object.entries(f.properties || {}).filter(([k, v]) => v !== null && v !== '' && !/^(shape|objectid|fid)/i.test(k));
    const row = ([k, v]) => `<div class="popup-row"><span class="popup-k">${esc(k)}</span><span class="popup-v">${esc(fmtVal(k, v))}</span></div>`;
    const head = entries.slice(0, 4), rest = entries.slice(4);
    return '<div class="popup">' + head.map(row).join('')
      + (rest.length ? `<details><summary>All ${entries.length} fields</summary>${rest.map(row).join('')}</details>` : '') + '</div>';
  };
  // drawing order: planning layers at the bottom, site constraints above, power lines on top
  MAP.createPane('constraints').style.zIndex = 420;
  MAP.createPane('flood').style.zIndex = 430;
  MAP.createPane('power').style.zIndex = 440;
  MAP.createPane('parcel').style.zIndex = 450;
  (L0.sources || []).filter(s => /Zone|plan|Overlay|Priority/.test(s.what) && /\/(FeatureServer|MapServer)\/\d+$/.test(s.layer))
    .forEach((s, i) => {
      const c = COLORS[i % COLORS.length];
      const lyr = new ClippedLayer({layer: s.layer, name: s.source, category: 'Zone', geometry: 'polygon'},
        () => ({color: c, weight: 2, fillColor: c, fillOpacity: 0.12}), f => `<div class="popup-title">${esc(s.source)}</div>` + popup(f));
      const on = s.hit || s.what === 'Zone' || (s.what !== 'Overlay' && !/^(none|not)/.test(s.result));
      const name = `<span style="color:${c}">&#9632;</span> ${esc(s.what === 'Overlay' ? s.source : s.what)}${s.hit ? ' <b>(on this lot)</b>' : ''}`;
      overlays[name] = lyr; if (on) lyr.addTo(MAP);
    });
  const zoneCount = Object.keys(overlays).length;
  (L0.site_constraints || []).filter(c => c.status === 'ok' && /\/(FeatureServer|MapServer)\/\d+$/.test(c.layer)).forEach(c => {
    const col = catColor(c.category), power = c.category === 'Electricity';
    // the same filter as the check, so the map shows what was tested (only easements, only substations …)
    const style = f => {
      const p = (f && f.properties) || {};
      const underground = p.ASSET_TYPE === 'UG' || p.UG_OH === 'U';
      if (c.geometry === 'polygon') {
        // areas: the publisher's colours, filled without outlines, as the councils draw them. Flood and other
        // modelled overlays are traced from 2.5-5 m model grid cells, each its own tiny polygon (see features.ts) --
        // at a low fillOpacity, same-value neighbouring cells each anti-alias their shared edge independently and
        // double-blend it against the basemap, which reads as a visible seam/checkerboard. Near-solid fill makes
        // touching same-colour cells indistinguishable (same look official flood-map viewers use: solid colour
        // bands with a legend, not a translucent wash); anyone who wants the plain photo can toggle the layer off.
        // Property-shaped areas (easements, heritage places) keep a thin edge because the boundary itself matters.
        const fill = areaColor(c, p);
        const edged = ['Easements', 'Heritage', 'Buildings'].includes(c.category);
        return {stroke: edged, color: fill, weight: 1.5, opacity: 0.9, fillColor: fill,
          fillOpacity: ['Noise', 'Airport'].includes(c.category) ? 0.45 : 0.78};
      }
      return {color: col, weight: power ? 4 : c.hit ? 3 : 2, opacity: 0.95,
        dashArray: power ? (underground ? '8 6' : null) : '6 4', fillOpacity: 0};
    };
    // Every layer is drawn through our server (/api/features): it asks each service for the same coordinate system
    // (GDA2020, see geo.SR) so all layers line up with each other and the imagery. Drawing straight from the services
    // would use esri-leaflet's own request, and the State's Web Mercator layers then sit about 1.5 m off.
    // Also: council overlays are often a few city-wide features (Brisbane's creek flood planning area is 13 MB per view
    // straight from the service), and the server sends only the part in view.
    const pane = 'constraints';
    const pointToLayer = c.geometry === 'point' ? (g, ll) => L.circleMarker(ll, {radius: power ? 6 : 5, color: '#fff', weight: 1.5,
      fillColor: col, fillOpacity: 1, pane, renderer: paneRenderer(MAP)}) : undefined;
    const lyr = new ClippedLayer(c, style, f => `<div class="popup-title">${esc(c.name)}</div>` + popup(f), pointToLayer);
    overlays[`${swatch(col)} ${esc(c.category)}: ${esc(c.name)}${c.hit ? ' <b>(on this lot)</b>' : ''}`] = lyr;
    // water mains normally run in the road beside the lot, so they are drawn whether or not one touches the lot
    if (c.hit || c.category === 'Buildings' || /water (pressure )?main/i.test(c.name)) lyr.addTo(MAP);
  });
  // Queensland Fire Department's Bushfire Prone Area (SEQ, July 2017): published only as a picture map, so it cannot be
  // tested against the lot. Shown for reference; switched on where bushfire is not checked automatically (Ipswich).
  const qfd = L.esri.tiledMapLayer({url: 'https://tiles.arcgis.com/tiles/vkTwD8kHw2woKBqV/arcgis/rest/services/Bushfire_Prone_Areas/MapServer',
    opacity: 0.55, pane: 'constraints', attribution: 'Bushfire Prone Area &copy; Queensland Fire Department'});
  overlays[`${swatch('#dc2626')} Bushfire prone area (QFD, picture only)${(L0.not_checked || []).includes('Bushfire') ? ' <b>(not checked automatically)</b>' : ''}`] = qfd;
  if ((L0.not_checked || []).includes('Bushfire')) qfd.addTo(MAP);
  const constraintsCount = Object.keys(overlays).length - zoneCount;
  let home = () => MAP.setView(center, 18);
  if (L0.parcel_geometry) {
    const parcel = L.polygon((L0.parcel_map_geometry || L0.parcel_geometry).map(r => r.map(([x, y]) => [y, x])),
      {color: '#ef0000', weight: 4, fillOpacity: 0.04, pane: 'parcel', interactive: false}).addTo(MAP);   // not clickable: it must not block the layers below
    overlays['<span style="color:#ef0000">&#9632;</span> Parcel'] = parcel;
    home = () => MAP.fitBounds(parcel.getBounds(), {maxZoom: 19, padding: [40, 40]});
  }
  home();
  // ⌂ in the same group as + / −: back to the property at the starting zoom
  const a = L.DomUtil.create('a', 'map-home', MAP.zoomControl.getContainer());
  a.href = '#'; a.title = 'Back to the property'; a.setAttribute('role', 'button'); a.setAttribute('aria-label', 'Back to the property');
  a.innerHTML = '&#8962;';
  L.DomEvent.on(a, 'click', e => { L.DomEvent.stop(e); home(); });
  // North arrow: the map tiles are plain Web Mercator (never rotated), so "up" is always north; this is a fixed
  // reference, not a live compass. Several rules depend on which boundary faces south/west (e.g. a built-to-boundary
  // concession), so it matters that north is easy to check at a glance.
  const compass = L.control({position: 'bottomleft'});
  compass.onAdd = () => {
    const div = L.DomUtil.create('div', 'compass');
    div.title = 'North is up — the map is never rotated';
    div.innerHTML = '<svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true">'
      + '<text x="11" y="8" text-anchor="middle" font-size="9" font-weight="700" fill="#1d2330">N</text>'
      + '<path d="M11 10 L14 19 L11 17 L8 19 Z" fill="#b42318"/>'   /* red: points north, up */
      + '<path d="M11 26 L14 19 L11 21 L8 19 Z" fill="#9aa4b2"/></svg>';   /* grey: south half of the needle */
    return div;
  };
  compass.addTo(MAP);
  const parcelCount = Object.keys(overlays).length - zoneCount - constraintsCount;
  L.marker(center, {icon: propertyIcon}).addTo(MAP).bindPopup(esc(L0.geocode ? L0.geocode.address : `${L0.lat}, ${L0.lon}`));
  const layersControl = L.control.layers({'Streets': streets, 'Aerial imagery (Qld, latest)': qldSat, 'Aerial imagery (Esri)': sat}, overlays, {collapsed: Object.keys(overlays).length > 12}).addTo(MAP);
  groupOverlayControl(layersControl, [
    {label: 'Zoning & planning', count: zoneCount},
    {label: 'Site constraints', count: constraintsCount},
    {label: 'Property', count: parcelCount},
  ]);
}
</script>
</body>
</html>
